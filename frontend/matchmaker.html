<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchmaker — CollabSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Toastify CSS & JS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="min-h-screen pb-12 antialiased">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-[#142124] border-b border-[#213236] sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 p-0.5 shadow-lg shadow-emerald-500/20">
          <div class="w-full h-full bg-[#0b1315] rounded-[10px] flex items-center justify-center">
            <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18" />
              <circle cx="6" cy="6" r="3" class="fill-emerald-400/20" />
              <circle cx="18" cy="18" r="3" class="fill-emerald-400/20" />
              <circle cx="18" cy="6" r="2" class="fill-emerald-400" />
              <circle cx="6" cy="18" r="2" class="fill-emerald-400" />
            </svg>
          </div>
        </div>
        <span class="text-xl font-bold text-emerald-50 tracking-tight">Collab<span class="text-emerald-400">Sphere</span></span>
      </div>

      <nav class="flex items-center gap-6 text-sm font-medium text-slate-400">
        <a href="dashboard.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </a>
        <a href="matchmaker.html" class="text-emerald-300 font-bold border-b-2 border-emerald-400 py-5 flex items-center gap-1.5">
          <i data-lucide="compass" class="w-4 h-4"></i> Matchmaker
        </a>
        <a href="tracker.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="kanban" class="w-4 h-4"></i> Tracker
        </a>
        <a href="message.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="message-square" class="w-4 h-4"></i> Messages
        </a>
        <a href="profile.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="user-cog" class="w-4 h-4"></i> Profile
        </a>
      </nav>

      <div class="flex items-center gap-4">
        <span id="userRoleBadge" class="bg-emerald-400/10 text-emerald-300 border border-emerald-400/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
          LOADING...
        </span>
        <button id="logoutBtn" class="text-xs font-semibold text-slate-300 hover:text-white px-3.5 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 transition active:scale-95 flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN MATCHMAKER CONTAINER -->
  <main class="max-w-7xl mx-auto px-6 pt-8">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
      <div>
        <h1 id="searchTitle" class="text-2xl font-bold text-emerald-50 flex items-center gap-2">
          <i data-lucide="compass" class="w-6 h-6 text-emerald-400"></i>
          Discover & Match Creators
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Explore verified accounts or filter by niche, handles, and keywords.
        </p>
      </div>

      <!-- SEARCH BAR -->
      <div class="flex items-center gap-2 w-full md:w-auto">
        <div class="relative flex-1 md:w-80">
          <input 
            type="text" 
            id="searchInput" 
            autocomplete="off"
            class="input-field w-full rounded-xl px-4 py-2.5 text-xs placeholder-slate-500"
            placeholder="Search by keyword, niche, or handle..."
          />
        </div>

        <button 
          id="searchBtn" 
          class="btn-mint text-xs font-bold px-5 py-2.5 rounded-xl shadow-md flex items-center gap-1.5"
        >
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          Filter
        </button>
      </div>
    </div>

    <!-- DIRECTORY GRID -->
    <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full card-surface p-8 rounded-2xl text-center text-slate-400 text-xs animate-pulse">
        Loading directory...
      </div>
    </div>
  </main>

  <script src="js/matchmaker.js"></script>
  <script src="js/global-nav.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
