<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — CollabSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Toastify CSS & JS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="min-h-screen pb-12 antialiased">

  <!-- NAVBAR -->
  <header class="bg-[#142124] border-b border-[#213236] sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 p-0.5 shadow-lg shadow-emerald-500/20">
          <div class="w-full h-full bg-[#0b1315] rounded-[10px] flex items-center justify-center">
            <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18" />
              <circle cx="6" cy="6" r="3" class="fill-emerald-400/20" />
              <circle cx="18" cy="18" r="3" class="fill-emerald-400/20" />
              <circle cx="18" cy="6" r="2" class="fill-emerald-400" />
              <circle cx="6" cy="18" r="2" class="fill-emerald-400" />
            </svg>
          </div>
        </div>
        <span class="text-xl font-bold text-emerald-50 tracking-tight">Collab<span class="text-emerald-400">Sphere</span></span>
      </div>

      <nav class="flex items-center gap-6 text-sm font-medium text-slate-400">
        <a href="dashboard.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </a>
        <a href="matchmaker.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="compass" class="w-4 h-4"></i> Matchmaker
        </a>
        <a href="tracker.html" class="hover:text-slate-200 transition flex items-center gap-1.5">
          <i data-lucide="kanban" class="w-4 h-4"></i> Tracker
        </a>
        <a href="profile.html" class="text-emerald-300 font-bold border-b-2 border-emerald-400 py-5 flex items-center gap-1.5">
          <i data-lucide="user-cog" class="w-4 h-4"></i> Profile
        </a>
      </nav>

      <div class="flex items-center gap-4">
        <span id="userRoleBadge" class="bg-emerald-400/10 text-emerald-300 border border-emerald-400/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
          LOADING...
        </span>
        <button id="logoutBtn" class="text-xs font-semibold text-slate-300 hover:text-white px-3.5 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 transition active:scale-95 flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN PROFILE CONTAINER -->
  <main class="max-w-3xl mx-auto px-6 pt-8">
    <div class="card-surface p-8 rounded-2xl shadow-xl">
      <div class="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b border-[#213236]">
        <img id="profileAvatar" src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&q=80&w=200" class="w-20 h-20 rounded-2xl object-cover border-2 border-emerald-400/40 shadow-md" />
        <div class="text-center sm:text-left">
          <h1 id="profileDisplayName" class="text-xl font-bold text-emerald-50">User Name</h1>
          <p id="profileSubText" class="text-xs font-semibold text-emerald-300 mt-0.5">Category • Location</p>
          <div class="flex items-center justify-center sm:justify-start gap-2 mt-2 text-[11px] text-slate-400">
            <span class="bg-[#080e10] border border-[#213236] px-2 py-0.5 rounded text-amber-300 font-bold flex items-center gap-1">
              <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i> 4.9 Rating
            </span>
            <span id="profileMeta">@handle</span>
          </div>
        </div>
      </div>

      <form id="profileForm" class="mt-6 space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Display Name</label>
            <input type="text" id="inputName" class="input-field w-full rounded-xl px-3.5 py-2 text-xs" />
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Email Address</label>
            <input type="email" id="inputEmail" readonly class="input-field w-full rounded-xl px-3.5 py-2 text-xs bg-[#080e10]/60 text-slate-500 cursor-not-allowed" />
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Category / Niche</label>
            <input type="text" id="inputCategory" class="input-field w-full rounded-xl px-3.5 py-2 text-xs" />
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Social Meta / Offer Perk</label>
            <input type="text" id="inputMeta" class="input-field w-full rounded-xl px-3.5 py-2 text-xs" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Bio / Description</label>
          <textarea id="inputBio" rows="3" class="input-field w-full rounded-xl p-3 text-xs resize-none"></textarea>
        </div>

        <button type="submit" class="btn-mint px-6 py-2.5 rounded-xl text-xs shadow-md flex items-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i>
          Save Changes
        </button>
      </form>
    </div>
  </main>

  <script src="js/profile.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
